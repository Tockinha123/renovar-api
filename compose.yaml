services:

  api:
    build: .
    container_name: renovar_api
    restart: unless-stopped ## lembrar que se desligar a ec2, tem que ligar o container dnv 
    ports:
      - 80:8080
    env_file:
      - .env
    depends_on:
      - db
      - minio

  db:
    image: postgres:18-alpine
    container_name: renovar_postgres_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: renovar_minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    ports:
      - ${MINIO_API_PORT}:9000
      - ${MINIO_CONSOLE_PORT}:9001
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
