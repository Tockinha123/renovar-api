spring:
  application:
    name: renovarAPI

  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT}/${DB_NAME}
  
  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    
  config:
    import: optional:file:.env[.properties]



api:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-s: ${JWT_EXPIRATION_SEC}

scalar:
  page-title: Renovar API Documentation
  theme: deep-space
  dark-mode: true
  layout: modern


minio:
  url: ${MINIO_URL}
  username: ${MINIO_USER}
  password: ${MINIO_PASSWORD}
  bucket: ${MINIO_BUCKET_REPORT}