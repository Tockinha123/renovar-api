server {

    listen       80;
    server_name  localhost;

    location / {
        proxy_pass          http://api:8080;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
    }

    location /minio/ {
        proxy_pass          http://minio:9000/;
        proxy_http_version  1.1;
    }

}